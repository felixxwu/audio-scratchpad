name: Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: mac/build.sh "$TAG"
        env:
          TAG: ${{ github.event.release.tag_name }}
      - name: Attach the app to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          ditto -c -k --keepParent "build/Audio Scratchpad.app" "Audio-Scratchpad-$TAG-mac.zip"
          gh release upload "$TAG" "Audio-Scratchpad-$TAG-mac.zip" --clobber

  check-web:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: web/check.sh

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: windows\build.cmd %TAG%
        shell: cmd
        env:
          TAG: ${{ github.event.release.tag_name }}
      - name: Attach the app to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cp "build/Audio Scratchpad.exe" "Audio-Scratchpad-$TAG-windows.exe"
          gh release upload "$TAG" "Audio-Scratchpad-$TAG-windows.exe" --clobber
