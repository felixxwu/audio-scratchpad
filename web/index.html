<!doctype html>
<!-- The browser version of Audio Scratchpad: records the microphone, or whatever the browser's sharing popup offers, to .wav files kept in browser storage. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audio Scratchpad</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='-4.5 -4.5 56 56'><path fill='%23b39400' d='M44 5H47V47H5V44H44Z'/><rect width='42' height='42' fill='%23ffdf1f'/><circle cx='21' cy='21' r='6.75' fill='none' stroke='%231a1814' stroke-width='1.65'/><circle cx='21' cy='21' r='3.825' fill='%231a1814'/></svg>">
<style>
  @font-face { font-family: 'Archivo'; font-stretch: 125%; font-weight: 400; font-display: swap; src: url(archivo-wide.woff2) format('woff2'); }
  @font-face { font-family: 'Archivo'; font-stretch: 125%; font-weight: 900; font-display: swap; src: url(archivo-wide-black.woff2) format('woff2'); }
  :root {
    color-scheme: light dark;
    --bg: #faf7f0;
    --text: #1a1814;
    --muted: #6b655a;
    --line: #1a1814;
    --control: #ece6d8;
    --accent: #1a1814;
    --highlight: #ffdf1f;
    --on-highlight: #1a1814;
    --highlight-shadow: #b39400;
    --record: #e8321e;
    --chevron: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M2 4l4 4 4-4' fill='none' stroke='%231a1814' stroke-width='2.4' stroke-linecap='square'/></svg>");
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14120f;
      --text: #f3eee3;
      --muted: #a39c8e;
      --line: #f3eee3;
      --control: #2a261f;
      --accent: #f3eee3;
      --record: #ff5a3c;
      --chevron: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'><path d='M2 4l4 4 4-4' fill='none' stroke='%23f3eee3' stroke-width='2.4' stroke-linecap='square'/></svg>");
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0 auto;
    padding: 16px;
    max-width: 680px;
    background: var(--bg);
    color: var(--text);
    font: expanded 14px/1.4 'Archivo', system-ui, sans-serif;
  }
  h1 {
    display: inline-block;
    margin: 0 0 16px;
    padding: 4px 30px;
    background: var(--text);
    color: var(--bg);
    font-size: 15px;
    font-weight: 900;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }
  button, a.icon { color: var(--accent); }
  .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .source { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 160px; font-weight: 900; text-transform: uppercase; }
  #source {
    flex: 1;
    min-width: 0;
    min-height: 42px;
    padding: 0 36px 0 12px;
    border: 1px solid var(--line);
    border-radius: 0;
    /* Browsers don't let the built-in arrow be moved, so this draws its own. */
    appearance: none;
    background: var(--bg) var(--chevron) no-repeat right 12px center / 12px;
    color: var(--text);
    font: inherit;
    font-weight: 400;
    text-transform: uppercase;
  }
  #source:disabled { opacity: 0.5; }
  /* Browsers without styleable dropdowns keep the system one. */
  @supports (appearance: base-select) {
    #source, #source::picker(select) { appearance: base-select; }
    #source { display: flex; align-items: center; }
    #source::picker-icon { display: none; }
    #source::picker(select) {
      margin-top: -1px;
      padding: 0;
      border: 1px solid var(--line);
      background: var(--bg);
      box-shadow: 3px 3px 0 var(--line);
      color: var(--text);
    }
    #source option { padding: 10px 12px; }
    #source option::checkmark { display: none; }
    #source option:checked { background: var(--control); }
    #source option:not(:disabled):hover, #source option:focus-visible { outline: 0; background: var(--highlight); color: var(--on-highlight); }
    #source option:disabled { opacity: 0.4; }
  }
  #timer:not(:empty) { padding: 2px 6px; background: var(--highlight); color: var(--on-highlight); font-weight: 900; font-variant-numeric: tabular-nums; }
  #record {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    min-width: 120px;
    min-height: 42px;
    padding: 0 18px;
    justify-content: center;
    border: 2px solid var(--highlight);
    border-radius: 0;
    background: var(--highlight);
    box-shadow: 0 0 0 2px var(--bg), 5px 5px 0 var(--highlight-shadow);
    color: var(--on-highlight);
    font: inherit;
    font-weight: 900;
    text-transform: uppercase;
    cursor: pointer;
  }
  #record:active:not(:disabled) { transform: translate(5px, 5px); box-shadow: 0 0 0 2px var(--bg); }
  #record:disabled { border-style: dashed; border-color: var(--muted); background: transparent; box-shadow: none; color: var(--muted); cursor: default; }
  #message { margin: 12px 0 0; padding: 8px 12px; border: 2px solid var(--line); text-align: center; }
  #share-hint:not([hidden]) { display: block; max-width: 100%; margin: 8px auto 4px; }
  hr { margin: 20px 0 0; border: 0; border-top: 1px solid var(--line); }
  #list { margin: 0; padding: 0; list-style: none; }
  #list li {
    display: grid;
    grid-template-columns: 32px minmax(0, 1fr) 116px 51px 32px 32px;
    align-items: center;
    gap: 4px;
    padding: 6px 0;
    border-bottom: 1px solid var(--line);
  }
  #list li:last-child { border-bottom: 0; }
  #list canvas { display: block; width: 100%; height: 28px; cursor: pointer; touch-action: none; }
  #list li.live canvas { cursor: default; }
  .time { padding-right: 7px; font-size: 11px; font-variant-numeric: tabular-nums; text-align: right; }
  .quality { position: relative; font-size: 11px; text-align: right; text-transform: uppercase; white-space: nowrap; }
  .quality.lost { justify-self: end; padding: 1px 4px; background: var(--highlight); color: var(--on-highlight); }
  /* Drawn here rather than with a title attribute, which browsers only show after a delay. */
  .quality[data-tooltip]:not([data-tooltip='']):hover::after {
    content: attr(data-tooltip);
    position: absolute;
    right: 0;
    bottom: calc(100% + 4px);
    z-index: 1;
    width: max-content;
    max-width: 240px;
    padding: 6px 8px;
    border: 2px solid var(--line);
    background: var(--bg);
    box-shadow: 3px 3px 0 var(--line);
    color: var(--text);
    font-weight: 400;
    text-align: left;
    text-transform: none;
    white-space: normal;
    pointer-events: none;
  }
  /* Shown in place of the quality label until the check finishes. */
  .loading-bar { position: relative; display: block; width: 44px; height: 6px; margin-left: auto; overflow: hidden; border: 2px solid var(--line); }
  .loading-bar::after { content: ''; position: absolute; inset: 0; width: 40%; background: var(--accent); animation: loading 1.2s steps(6) infinite; }
  @keyframes loading { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
  @media (prefers-reduced-motion: reduce) { .loading-bar::after { width: 100%; opacity: 0.5; animation: none; } }
  .icon {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    padding: 0;
    border: 0;
    border-radius: 0;
    background: none;
    cursor: pointer;
  }
  .icon:hover { background: var(--highlight); color: var(--on-highlight); }
  a.icon { cursor: grab; }
  .dot { color: var(--record); cursor: default; }
  .dot:hover { background: none; color: var(--record); }
  svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: square; stroke-linejoin: miter; }
  svg.solid { fill: currentColor; stroke: none; }
  #empty { padding: 48px 0; font-weight: 900; text-align: center; text-transform: uppercase; }
  footer { margin-top: 24px; color: var(--muted); font-size: 12px; }
  footer a { color: var(--text); font-weight: 900; }
  :focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
</style>
</head>
<body>
<h1>Audio Scratchpad</h1>
<div class="controls">
  <label class="source">
    Source
    <select id="source">
      <option value="apps">Other apps</option>
      <option value="microphone">Microphone</option>
    </select>
  </label>
  <span id="timer"></span>
  <button id="record" type="button"></button>
</div>
<div id="message" role="status" hidden>
  <span id="message-text"></span>
  <img id="share-hint" src="share-audio.gif" alt="Turning on the audio switch in Chrome's sharing popup" width="480" hidden>
</div>
<hr>
<ul id="list"></ul>
<p id="empty" hidden>No recordings yet</p>
<footer>
  Recordings stay in this browser until you download them, and clearing your browsing data deletes them.
  <a href="https://github.com/felixxwu/audio-scratchpad/releases/latest">Get the Mac or Windows app</a>
</footer>

<!-- Browsers only run these two from their own URL, so the page turns each into one when it starts. -->
<script type="text/plain" id="tap-code">
  // Runs on the audio thread and passes each slice of sound on as left/right pairs. Pauses arrive as silence.
  registerProcessor('tap', class extends AudioWorkletProcessor {
    process([input]) {
      const [left, right = left] = input;
      const frames = left?.length ?? 128;
      const samples = new Float32Array(frames * 2);
      for (let frame = 0; left && frame < frames; frame++) {
        samples[frame * 2] = left[frame];
        samples[frame * 2 + 1] = right[frame];
      }
      this.port.postMessage(samples, [samples.buffer]);
      return true;
    }
  });
</script>
<script type="text/plain" id="writer-code">
  // Saves captured audio to a 32-bit float .wav in browser storage, starting at the first non-zero sample.
  const sampleRate = 48000;
  const channels = 2;
  const headerSize = 44;
  const framesPerLoudnessValue = sampleRate / 20;

  let name;
  // WAV sizes are 32-bit, which limits a stereo recording to about 3 hours.
  let maxDataSize = 2 ** 32 - 1 - headerSize;
  let file;
  let dataSize = 0;
  let failed = false;
  let pendingLoudness = 0;
  let pendingFrames = 0;

  function header() {
    const view = new DataView(new ArrayBuffer(headerSize));
    const text = (offset, value) => [...value].forEach((c, i) => view.setUint8(offset + i, c.charCodeAt(0)));
    text(0, 'RIFF');
    view.setUint32(4, 36 + dataSize, true);
    text(8, 'WAVEfmt ');
    view.setUint32(16, 16, true);
    view.setUint16(20, 3, true); // IEEE float
    view.setUint16(22, channels, true);
    view.setUint32(24, sampleRate, true);
    view.setUint32(28, sampleRate * channels * 4, true);
    view.setUint16(32, channels * 4, true);
    view.setUint16(34, 32, true);
    text(36, 'data');
    view.setUint32(40, dataSize, true);
    return view;
  }

  async function createFile() {
    const folder = await navigator.storage.getDirectory();
    let chosen = `${name}.wav`;
    for (let copy = 2; await exists(folder, chosen); copy++) chosen = `${name} ${copy}.wav`;
    const handle = await folder.getFileHandle(chosen, { create: true });
    file = await handle.createSyncAccessHandle();
    file.write(header(), { at: 0 });
    postMessage({ type: 'started', name: chosen });
  }

  async function exists(folder, fileName) {
    try {
      await folder.getFileHandle(fileName);
      return true;
    } catch (error) {
      if (error.name === 'NotFoundError') return false;
      throw error;
    }
  }

  async function append(samples) {
    if (!file) {
      const first = samples.findIndex((sample) => sample !== 0);
      if (first < 0) return;
      samples = samples.subarray(first - first % channels);
      await createFile();
    }
    if (dataSize + samples.byteLength > maxDataSize) {
      throw new Error('The recording reached the largest size a WAV file can hold.');
    }
    const written = file.write(samples, { at: headerSize + dataSize });
    if (written < samples.byteLength) {
      file.truncate(headerSize + dataSize);
      throw new Error('Browser storage is full.');
    }
    dataSize += written;
    // Kept current after every write, so a crash still leaves a playable file.
    file.write(header(), { at: 0 });
    reportLoudness(samples);
  }

  function reportLoudness(samples) {
    for (const sample of samples) pendingLoudness = Math.max(pendingLoudness, Math.abs(sample));
    pendingFrames += samples.length / channels;
    if (pendingFrames < framesPerLoudnessValue) return;
    postMessage({ type: 'loudness', value: pendingLoudness });
    pendingLoudness = 0;
    pendingFrames = 0;
  }

  // Creating the file is asynchronous, so audio waits its turn here to stay in order.
  let queue = Promise.resolve();
  function enqueue(job) {
    queue = queue.then(job).catch((error) => {
      failed = true;
      postMessage({ type: 'failed', message: error.name === 'QuotaExceededError' ? 'Browser storage is full.' : error.message });
    });
  }

  onmessage = ({ data }) => {
    if (data.type === 'start') {
      name = data.name;
      maxDataSize = data.maxDataSize ?? maxDataSize;
      data.port.onmessage = ({ data: samples }) => enqueue(async () => {
        if (!failed) await append(samples);
      });
    } else if (data.type === 'stop') {
      enqueue(() => {
        file?.close();
        postMessage({ type: 'stopped', saved: file !== undefined });
      });
    }
  };
</script>

<script type="text/plain" id="quality-code">
  // Judges recordings' real quality with the shared audio-quality.js, one at a time, reading only the parts it needs.
  const headerSize = 44;
  const channels = 2;
  const sampleRate = 48000;

  async function check(file) {
    const frames = Math.floor((file.size - headerSize) / (channels * 4));
    const ranges = AudioQuality.excerptRanges(frames, sampleRate);
    const parts = [];
    for (let i = 0; i < ranges.length; i += 2) {
      const start = headerSize + ranges[i] * channels * 4;
      const bytes = await file.slice(start, start + ranges[i + 1] * channels * 4).arrayBuffer();
      parts.push(new Float32Array(bytes, 0, bytes.byteLength >> 2));
    }
    const samples = new Float32Array(parts.reduce((total, part) => total + part.length, 0));
    parts.reduce((offset, part) => (samples.set(part, offset), offset + part.length), 0);
    return AudioQuality.analyzeExcerpts(samples, channels, sampleRate, ranges);
  }

  let queue = Promise.resolve();
  onmessage = ({ data }) => {
    queue = queue.then(async () => {
      try {
        if (!self.AudioQuality) importScripts(data.scriptUrl);
        const { verdict, label, summary, tooltip } = await check(data.file);
        postMessage({ id: data.id, verdict, label, summary, tooltip });
      } catch (error) {
        postMessage({ id: data.id, verdict: 'unknown', label: '', summary: `The quality check failed: ${error.message}`, tooltip: `The quality check failed: ${error.message}` });
      }
    });
  };
</script>

<script>
const SAMPLE_RATE = 48000;
const HEADER_SIZE = 44;
const BYTES_PER_FRAME = 8;
const BARS = 400;
// Asks browsers for the sound as it is, without the clean-up they apply to calls by default.
const UNPROCESSED_AUDIO = {
  autoGainControl: false,
  echoCancellation: false,
  noiseSuppression: false,
  sampleRate: SAMPLE_RATE,
  channelCount: 2,
};

const openMicrophone = () => navigator.mediaDevices.getUserMedia({ audio: UNPROCESSED_AUDIO });

const scriptUrl = (id) =>
  URL.createObjectURL(new Blob([document.getElementById(id).textContent], { type: 'text/javascript' }));
const tapUrl = scriptUrl('tap-code');
const writerUrl = scriptUrl('writer-code');
const qualityUrl = scriptUrl('quality-code');

const icons = {
  record: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4" fill="currentColor"/></svg>',
  stop: '<svg class="solid" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg>',
  play: '<svg class="solid" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>',
  download: '<svg viewBox="0 0 24 24"><path d="M12 4v11m-5-5 5 5 5-5M5 20h14"/></svg>',
  trash: '<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3m3 0-1 13H7L6 7m4 4v5m4-5v5"/></svg>',
  dot: '<svg class="solid" viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg>',
};

// Holds a recording's loudness as it grows, merging older values so redrawing stays quick however long it runs.
class LoudnessHistory {
  values = [];
  #reportsPerValue = 1;
  #pendingReports = 0;

  append(value, bars = BARS) {
    if (this.#pendingReports === 0) this.values.push(value);
    else this.values[this.values.length - 1] = Math.max(this.values[this.values.length - 1], value);
    this.#pendingReports++;
    if (this.#pendingReports < this.#reportsPerValue) return;
    this.#pendingReports = 0;
    if (this.values.length < bars * 2) return;
    this.values = this.values.filter((_, i) => i % 2 === 0).map((value, i) => Math.max(value, this.values[i * 2 + 1]));
    this.#reportsPerValue *= 2;
  }
}

// Squeezes loudness values into at most `bars`, scaled to the loudest so quiet audio is still readable.
function fitWaveform(values, bars = BARS) {
  let fitted = values;
  if (values.length > bars) {
    fitted = new Array(bars).fill(0);
    values.forEach((value, i) => {
      const bar = Math.floor((i * bars) / values.length);
      fitted[bar] = Math.max(fitted[bar], value);
    });
  }
  const loudest = Math.max(0, ...fitted);
  return loudest > 0 ? fitted.map((value) => value / loudest) : fitted;
}

// Reduces a recording to a short list of loudness values, one for each bar of the drawn waveform.
async function waveformPeaks(file, bars = BARS) {
  const frames = Math.floor((file.size - HEADER_SIZE) / BYTES_PER_FRAME);
  const peaks = new Array(bars).fill(0);
  const framesPerRead = 65536;
  for (let position = 0; position < frames; position += framesPerRead) {
    const start = HEADER_SIZE + position * BYTES_PER_FRAME;
    const bytes = await file.slice(start, start + framesPerRead * BYTES_PER_FRAME).arrayBuffer();
    const samples = new Float32Array(bytes, 0, Math.floor(bytes.byteLength / 4));
    for (let i = 0; i < samples.length; i++) {
      const bar = Math.min(bars - 1, Math.floor(((position + (i >> 1)) * bars) / frames));
      peaks[bar] = Math.max(peaks[bar], Math.abs(samples[i]));
    }
  }
  return fitWaveform(peaks, bars);
}

// Judges whether a recording is lossless, lossy or upsampled, using audio-quality.js (shared with the Mac and Windows apps).
let qualityWorker = null;
const qualityJobs = new Map();
let qualityJobCount = 0;
function checkQuality(name, file) {
  // The check can't tell a microphone's own filter from a lossy encoder's, and the app already knows the answer.
  if (name.startsWith('Microphone ')) return Promise.resolve({ label: 'Lossless', tooltip: 'Recorded straight from the microphone, so nothing was lost.' });
  if (!qualityWorker) {
    qualityWorker = new Worker(qualityUrl);
    qualityWorker.onmessage = ({ data }) => {
      qualityJobs.get(data.id)(data);
      qualityJobs.delete(data.id);
    };
  }
  const id = qualityJobCount++;
  return new Promise((resolve) => {
    qualityJobs.set(id, resolve);
    qualityWorker.postMessage({ id, file, scriptUrl: new URL('audio-quality.js', location.href).href });
  });
}

// Connects a sound source to the file writer. The audio thread talks to the writer directly, so a busy page can't delay it.
async function startWriter(context, sourceNode, worker, name) {
  await context.audioWorklet.addModule(tapUrl);
  const tap = new AudioWorkletNode(context, 'tap', {
    channelCount: 2,
    channelCountMode: 'explicit',
    channelInterpretation: 'speakers',
  });
  worker.postMessage({ type: 'start', name, port: tap.port }, [tap.port]);
  sourceNode.connect(tap);
  // The tap only runs while connected to the output. It writes nothing there, so this makes no sound.
  tap.connect(context.destination);
  return tap;
}

function drawWaveform(canvas, peaks, playhead) {
  const scale = devicePixelRatio;
  const width = Math.round(canvas.clientWidth * scale);
  const height = Math.round(canvas.clientHeight * scale);
  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
  }
  const paint = canvas.getContext('2d');
  paint.clearRect(0, 0, width, height);
  if (!peaks?.length) return;
  const style = getComputedStyle(canvas);
  paint.fillStyle = style.getPropertyValue('--accent');
  const pitch = 3 * scale;
  const barWidth = Math.round(2 * scale);
  for (let x = 0; x < width; x += pitch) {
    const from = Math.floor((x / width) * peaks.length);
    const to = Math.max(from + 1, Math.floor(((x + pitch) / width) * peaks.length));
    const barHeight = Math.round(Math.max(scale, Math.max(...peaks.slice(from, to)) * height));
    // Whole-pixel edges, because blurred edges show up as faint stripes.
    paint.fillRect(Math.round(x), Math.round((height - barHeight) / 2), barWidth, barHeight);
  }
  if (playhead !== undefined) {
    paint.fillStyle = style.getPropertyValue('--text');
    paint.fillRect(width * playhead - 2 * scale, 0, 4 * scale, height);
    paint.fillStyle = style.getPropertyValue('--highlight');
    paint.fillRect(width * playhead - scale, 0, 2 * scale, height);
  }
}

const formatTime = (seconds) => {
  const whole = Math.floor(seconds);
  return `${Math.floor(whole / 60)}:${String(whole % 60).padStart(2, '0')}`;
};

function runApp() {
  const element = (id) => document.getElementById(id);
  const recordButton = element('record');
  const list = element('list');
  const sourcePicker = element('source');
  // Firefox and Safari can share a screen but never its sound; only Chromium browsers have userAgentData.
  const canShareApps = Boolean(navigator.mediaDevices?.getDisplayMedia && navigator.userAgentData);
  const canUseMicrophone = Boolean(navigator.mediaDevices?.getUserMedia);
  const supported = (canShareApps || canUseMicrophone) && navigator.storage?.getDirectory;
  sourcePicker.options[0].disabled = !canShareApps;
  sourcePicker.options[1].disabled = !canUseMicrophone;
  if (!canShareApps) sourcePicker.value = 'microphone';

  // One of: idle, starting, waiting, recording, stopping.
  let state = 'idle';
  let capture = null;
  let startedAt = 0;
  let timerInterval = null;
  let liveRow = null;
  let rows = new Map();
  let playing = null;

  const showMessage = (text = '', withShareHint = false) => {
    element('message').hidden = !text;
    element('message-text').textContent = text;
    element('share-hint').hidden = !withShareHint;
  };

  function updateControls() {
    const capturing = state === 'waiting' || state === 'recording';
    recordButton.disabled = !supported || state === 'starting' || state === 'stopping';
    recordButton.innerHTML = capturing ? icons.stop : icons.record;
    recordButton.append(state === 'waiting' ? 'waiting for audio...' : capturing ? 'Stop' : 'Record');
    sourcePicker.disabled = !supported || state !== 'idle';
    element('timer').textContent = state === 'recording' ? formatTime((Date.now() - startedAt) / 1000) : '';
    element('empty').hidden = rows.size > 0 || state === 'recording';
  }

  function showRows() {
    const ordered = [...rows.values()].sort((a, b) => b.file.lastModified - a.file.lastModified || (a.name < b.name ? 1 : -1));
    list.replaceChildren(...(liveRow ? [liveRow.element] : []), ...ordered.map((row) => row.element));
    updateControls();
    redraw();
  }

  function redraw() {
    if (liveRow) drawWaveform(liveRow.canvas, fitWaveform(liveRow.history.values));
    for (const row of rows.values()) drawWaveform(row.canvas, row.peaks, playing?.row === row ? playhead() : undefined);
  }

  const playhead = () => (playing.row.duration > 0 ? Math.min(playing.audio.currentTime / playing.row.duration, 1) : 0);

  async function refreshRecordings() {
    const found = new Map();
    const folder = await navigator.storage.getDirectory();
    for await (const [name, handle] of folder.entries()) {
      if (!name.endsWith('.wav') || name === capture?.fileName) continue;
      try {
        found.set(name, await handle.getFile());
      } catch {
        // Another tab is still recording this one, so it joins the list once finished.
      }
    }
    const next = new Map();
    for (const [name, file] of found) {
      const known = rows.get(name);
      next.set(name, known?.file.size === file.size ? known : createRow(name, file));
    }
    for (const [name, row] of rows) {
      if (next.get(name) === row) continue;
      if (playing?.row === row) stopPlayback();
      URL.revokeObjectURL(row.url);
    }
    rows = next;
    showRows();
  }

  function createRow(name, file) {
    const row = {
      name,
      file,
      url: URL.createObjectURL(file),
      duration: Math.max(0, file.size - HEADER_SIZE) / BYTES_PER_FRAME / SAMPLE_RATE,
      peaks: null,
      element: document.createElement('li'),
    };
    const title = name.replace(/\.wav$/, '');
    row.element.innerHTML = `
      <button class="icon play" type="button" aria-label="Play">${icons.play}</button>
      <canvas role="img"></canvas>
      <span class="quality"><span class="loading-bar" role="progressbar" aria-label="Checking quality"></span></span>
      <span class="time">${formatTime(Math.round(row.duration))}</span>
      <a class="icon" draggable="true" aria-label="Download" title="Click to download, or drag into another app">${icons.download}</a>
      <button class="icon delete" type="button" aria-label="Delete" title="Delete">${icons.trash}</button>`;
    row.canvas = row.element.querySelector('canvas');
    row.canvas.title = title;
    row.canvas.setAttribute('aria-label', title);
    row.playButton = row.element.querySelector('.play');
    row.playButton.onclick = () => (playing?.row === row ? stopPlayback() : play(row));
    row.element.querySelector('.delete').onclick = () => deleteRecording(row);

    const download = row.element.querySelector('a');
    download.href = row.url;
    download.download = name;
    // Chrome and Edge turn this into a real file when it's dropped onto another app.
    download.ondragstart = (event) => event.dataTransfer.setData('DownloadURL', `audio/wav:${name}:${row.url}`);

    const seekFromPointer = (event) => {
      const box = row.canvas.getBoundingClientRect();
      seek(row, (event.clientX - box.left) / box.width);
    };
    row.canvas.onpointerdown = (event) => {
      row.canvas.setPointerCapture(event.pointerId);
      seekFromPointer(event);
    };
    row.canvas.onpointermove = (event) => {
      if (row.canvas.hasPointerCapture(event.pointerId)) seekFromPointer(event);
    };

    waveformPeaks(file).then((peaks) => {
      row.peaks = peaks;
      drawWaveform(row.canvas, peaks, playing?.row === row ? playhead() : undefined);
    }).catch(() => {});
    checkQuality(name, file).then(({ label, tooltip }) => {
      const quality = row.element.querySelector('.quality');
      quality.textContent = label;
      quality.classList.toggle('lost', Boolean(label) && label !== 'Lossless');
      // Hovering shows the reasons, and screen readers read them out with the label.
      quality.dataset.tooltip = tooltip;
      quality.setAttribute('aria-label', label ? `Quality: ${label}. ${tooltip}` : '');
    });
    return row;
  }

  function play(row) {
    stopPlayback();
    const audio = new Audio(row.url);
    audio.onended = stopPlayback;
    audio.play().catch((error) => {
      if (error.name !== 'AbortError') showMessage(`Couldn't play that recording: ${error.message}`);
      if (playing?.audio === audio) stopPlayback();
    });
    playing = { row, audio };
    row.playButton.innerHTML = icons.stop;
    row.playButton.setAttribute('aria-label', 'Stop playing');
    const animate = () => {
      if (playing?.audio !== audio) return;
      drawWaveform(row.canvas, row.peaks, playhead());
      requestAnimationFrame(animate);
    };
    animate();
  }

  function stopPlayback() {
    if (!playing) return;
    const { row, audio } = playing;
    playing = null;
    audio.pause();
    row.playButton.innerHTML = icons.play;
    row.playButton.setAttribute('aria-label', 'Play');
    drawWaveform(row.canvas, row.peaks);
  }

  function seek(row, fraction) {
    if (playing?.row !== row) play(row);
    // Stay just short of the end, so dragging there doesn't finish playback mid-drag.
    playing.audio.currentTime = row.duration * Math.min(Math.max(fraction, 0), 0.999);
  }

  async function deleteRecording(row) {
    // There's no trash to recover from in browser storage, unlike the desktop apps.
    if (!confirm(`Delete "${row.name}"? This can't be undone.`)) return;
    if (playing?.row === row) stopPlayback();
    try {
      const folder = await navigator.storage.getDirectory();
      await folder.removeEntry(row.name);
    } catch (error) {
      showMessage(`Couldn't delete that recording: ${error.message}`);
    }
    await refreshRecordings();
  }

  async function startRecording() {
    state = 'starting';
    showMessage();
    stopPlayback();
    updateControls();
    navigator.storage.persist?.().catch(() => {});

    const context = new AudioContext({ sampleRate: SAMPLE_RATE });
    const releaseAudio = (stream) => {
      stream?.getTracks().forEach((track) => track.stop());
      if (context.state !== 'closed') context.close();
    };
    const usingMicrophone = sourcePicker.value === 'microphone';
    let stream;
    let current;
    try {
      stream = await (usingMicrophone ? openMicrophone() : navigator.mediaDevices.getDisplayMedia({
        // The video is never used, but browsers won't share sound without it.
        video: { displaySurface: 'browser', frameRate: { max: 1 } },
        audio: {
          ...UNPROCESSED_AUDIO,
          // When recording all system sound, leave out anything this page plays.
          restrictOwnAudio: true,
        },
        // Offer one window's sound where the system can, and all system sound otherwise.
        windowAudio: 'window',
        systemAudio: 'include',
        selfBrowserSurface: 'exclude',
      }));
      const track = stream.getAudioTracks()[0];
      if (!track) {
        releaseAudio(stream);
        state = 'idle';
        showMessage('Press Record again and turn on the audio switch, like this:', true);
        updateControls();
        return;
      }
      await context.resume();

      const surface = stream.getVideoTracks()[0]?.getSettings().displaySurface;
      const sourceName = usingMicrophone ? 'Microphone' : { browser: 'Tab', window: 'Window', monitor: 'Screen' }[surface] ?? 'Browser';
      const stamp = new Date();
      const pad = (value) => String(value).padStart(2, '0');
      const name = `${sourceName} ${stamp.getFullYear()}-${pad(stamp.getMonth() + 1)}-${pad(stamp.getDate())} ${pad(stamp.getHours())}.${pad(stamp.getMinutes())}.${pad(stamp.getSeconds())}`;

      const worker = new Worker(writerUrl);
      current = { worker, stream, context, fileName: null };
      current.source = context.createMediaStreamSource(stream);
      current.release = () => releaseAudio(stream);
      worker.onmessage = ({ data }) => handleWriterMessage(current, data);
      worker.onerror = (event) => {
        worker.terminate();
        finishRecording(current, false, event.message);
      };
      track.onended = () => stopRecording(current);

      capture = current;
      liveRow = createLiveRow();
      state = 'waiting';
      showRows();
      current.tap = await startWriter(context, current.source, worker, name);
    } catch (error) {
      // Stopped while still starting, so the stop has already cleaned up.
      if (current && state === 'stopping') return;
      releaseAudio(stream);
      if (capture) {
        capture.worker.terminate();
        capture = null;
        liveRow = null;
      }
      state = 'idle';
      // A cancelled sharing popup also reports "not allowed", and needs no message. The system refusing does.
      if (usingMicrophone && error.name === 'NotAllowedError') {
        showMessage("This page can't use the microphone. Allow it in your browser and system privacy settings, then try again.");
      } else if (usingMicrophone && error.name === 'NotFoundError') {
        showMessage('No microphone was found.');
      } else if (error.name !== 'NotAllowedError' || /system/i.test(error.message)) {
        showMessage(/system/i.test(error.message)
          ? 'Your computer blocked screen sharing for this browser. Allow it in your system privacy settings, then try again.'
          : `Couldn't start recording: ${error.message}`);
      }
      showRows();
    }
  }

  function createLiveRow() {
    const row = { element: document.createElement('li'), history: new LoudnessHistory() };
    row.element.className = 'live';
    row.element.innerHTML = `
      <span class="icon dot" role="img" aria-label="Recording">${icons.dot}</span>
      <canvas role="img" aria-label="Waveform of the recording in progress"></canvas>
      <span></span><span class="time"></span><span></span><span></span>`;
    row.canvas = row.element.querySelector('canvas');
    return row;
  }

  function handleWriterMessage(current, data) {
    if (data.type === 'started') {
      current.fileName = data.name;
      state = 'recording';
      startedAt = Date.now();
      timerInterval = setInterval(() => {
        updateControls();
        if (liveRow) liveRow.element.querySelector('.time').textContent = formatTime((Date.now() - startedAt) / 1000);
      }, 250);
      updateControls();
    } else if (data.type === 'loudness' && liveRow) {
      liveRow.history.append(data.value);
      drawWaveform(liveRow.canvas, fitWaveform(liveRow.history.values));
    } else if (data.type === 'failed') {
      stopRecording(current, data.message);
    } else if (data.type === 'stopped') {
      current.worker.terminate();
      finishRecording(current, data.saved, current.stopReason);
    }
  }

  function stopRecording(current, reason) {
    if (capture !== current || state === 'stopping') return;
    state = 'stopping';
    current.stopReason = reason;
    current.tap?.disconnect();
    current.release();
    clearInterval(timerInterval);
    updateControls();
    current.worker.postMessage({ type: 'stop' });
  }

  function finishRecording(current, saved, reason) {
    if (capture !== current) return;
    clearInterval(timerInterval);
    if (state !== 'stopping') current.release();
    capture = null;
    liveRow = null;
    state = 'idle';
    if (reason) showMessage(`Recording stopped: ${reason}`);
    else if (!saved) showMessage('No sound came from that source, so nothing was saved.');
    refreshRecordings().catch((error) => showMessage(error.message));
  }

  recordButton.onclick = () => {
    if (state === 'idle') startRecording();
    else stopRecording(capture);
  };
  new ResizeObserver(redraw).observe(list);
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', redraw);

  updateControls();
  if (!supported) {
    showMessage("This browser can't record here. Use a desktop version of Chrome or Edge, or get the Mac or Windows app.");
    element('empty').hidden = true;
    return;
  }
  if (!canShareApps) showMessage('Recording other apps needs a desktop version of Chrome or Edge. This browser can record the microphone.');
  addEventListener('focus', () => refreshRecordings().catch(() => {}));
  refreshRecordings().catch((error) => showMessage(`Couldn't open browser storage: ${error.message}`));
}

// Fails CI if waveforms are drawn wrongly, or recordings don't start, stop and store samples as intended.
async function runSelfCheck() {
  const check = (condition, what) => {
    if (!condition) throw new Error(what);
  };
  const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const folder = await navigator.storage.getDirectory();
  const prefix = `self-check ${Date.now()}`;

  // Sends left/right pairs through the real writer, as the audio thread would.
  function openWriter(name, maxDataSize) {
    const worker = new Worker(writerUrl);
    const channel = new MessageChannel();
    const messages = [];
    worker.onmessage = ({ data }) => messages.push(data);
    worker.postMessage({ type: 'start', name, maxDataSize, port: channel.port2 }, [channel.port2]);
    return {
      worker,
      messages,
      send: (values) => channel.port1.postMessage(new Float32Array(values.flatMap((v) => [v, v]))),
      async stop() {
        await sleep(100);
        worker.postMessage({ type: 'stop' });
        while (!messages.some((m) => m.type === 'stopped')) await sleep(10);
        worker.terminate();
        return messages.find((m) => m.type === 'stopped').saved;
      },
    };
  }
  const readFile = async (fileName) => (await folder.getFileHandle(fileName)).getFile();
  const frames = async (fileName) => new Float32Array((await (await readFile(fileName)).arrayBuffer()).slice(HEADER_SIZE));

  const silent = openWriter(`${prefix} silent`);
  silent.send([0, 0, 0, 0]);
  check((await silent.stop()) === false, 'silence alone should not save a recording');
  let missing = false;
  await readFile(`${prefix} silent.wav`).catch(() => { missing = true; });
  check(missing, 'silence alone should not create a file');

  const fileName = `${prefix} main.wav`;
  const writer = openWriter(`${prefix} main`);
  writer.send([0, 0, 1.5, 0.25]);
  writer.send([0, 0.5]);
  check(await writer.stop(), 'a non-zero sample should save the recording');
  const samples = await frames(fileName);
  check(samples.length === 8, `should drop the lead-in, got ${samples.length} samples`);
  check(samples[0] === 1.5 && samples[1] === 1.5, 'should start on the first non-zero sample and keep peaks above full scale');
  check(samples[2] === 0.25 && samples[4] === 0 && samples[6] === 0.5, 'should keep later samples and silence');

  const view = new DataView(await (await readFile(fileName)).arrayBuffer());
  check(view.getUint32(4, true) === 36 + 32, 'header should store the right file size');
  check(view.getUint16(20, true) === 3, 'file should store float samples');
  check(view.getUint16(22, true) === 2, 'file should be stereo');
  check(view.getUint32(24, true) === 48000, 'file should be 48 kHz');
  check(view.getUint16(34, true) === 32, 'file should store 32-bit samples');
  check(view.getUint32(40, true) === 32, 'header should store the right audio size');

  const second = openWriter(`${prefix} main`);
  second.send([1]);
  await second.stop();
  check(second.messages[0].name === `${prefix} main 2.wav`, 'should never overwrite an existing recording');

  const full = openWriter(`${prefix} full`, 16);
  full.send([1, 1]);
  full.send([1]);
  await full.stop();
  check(full.messages.some((m) => m.type === 'failed'), 'should stop before the file outgrows what a WAV can hold');
  check((await readFile(`${prefix} full.wav`)).size === HEADER_SIZE + 16, 'a full recording should stay intact');

  const crashed = openWriter(`${prefix} crashed`);
  crashed.send([1, 1, 1]);
  await sleep(100);
  crashed.worker.terminate();
  await sleep(100);
  const crashedView = new DataView(await (await readFile(`${prefix} crashed.wav`)).arrayBuffer());
  check(crashedView.getUint32(40, true) === 24, 'a file still being written should already be playable');

  // Records a second of real audio through the audio thread and the writer.
  async function recordFromSource(createSource, name) {
    const context = new AudioContext({ sampleRate: SAMPLE_RATE });
    await context.resume();
    const worker = new Worker(writerUrl);
    const messages = [];
    worker.onmessage = ({ data }) => messages.push(data);
    const tap = await startWriter(context, createSource(context), worker, name);
    // Audio can be slow to start on a busy computer, so the second is only counted once sound reaches the file.
    const waitingSince = Date.now();
    while (!messages.some((m) => m.type === 'started')) {
      check(Date.now() - waitingSince < 15000, `no sound arrived for "${name}"`);
      await sleep(10);
    }
    await sleep(1000);
    tap.disconnect();
    await context.close();
    await sleep(100);
    worker.postMessage({ type: 'stop' });
    while (!messages.some((m) => m.type === 'stopped')) await sleep(10);
    worker.terminate();
    return messages;
  }

  // web/check.sh gives Chrome a fake microphone that beeps.
  const microphone = await openMicrophone();
  await recordFromSource((context) => context.createMediaStreamSource(microphone), `${prefix} microphone`);
  microphone.getTracks().forEach((track) => track.stop());
  const micSamples = await frames(`${prefix} microphone.wav`);
  check(micSamples.length > 0, 'microphone sound should reach the file');
  check(micSamples.every((s, i, all) => i % 2 === 0 || s === all[i - 1]), 'a one-channel microphone should reach both channels');

  const toneMessages = await recordFromSource((context) => {
    const oscillator = new OscillatorNode(context);
    oscillator.start();
    return oscillator;
  }, `${prefix} tone`);
  const toneFile = await readFile(`${prefix} tone.wav`);
  const toneSeconds = (toneFile.size - HEADER_SIZE) / BYTES_PER_FRAME / SAMPLE_RATE;
  check(toneSeconds > 0.5, `the audio thread should reach the file, got ${toneSeconds}s`);
  check(toneMessages.some((m) => m.type === 'loudness'), 'should report loudness while recording');
  check(new Float32Array((await toneFile.arrayBuffer()).slice(HEADER_SIZE)).every((s, i, all) => i % 2 === 0 || s === all[i - 1]), 'mono sound should reach both channels');
  const decoded = new Audio(URL.createObjectURL(toneFile));
  await new Promise((resolve, reject) => {
    decoded.onloadedmetadata = resolve;
    decoded.onerror = () => reject(new Error('the browser should be able to play a recording'));
  });
  check(Math.abs(decoded.duration - toneSeconds) < 0.05, `playback length should match, got ${decoded.duration}`);

  const peaksFile = new File([new ArrayBuffer(HEADER_SIZE), new Float32Array(200000 * 2).map((_, i) => (i >= 200000 && i % 2 ? 0.5 : 0))], 'peaks.wav');
  const peaks = await waveformPeaks(peaksFile, 100);
  check(peaks.length === 100, 'should make one value per bar');
  check(peaks.slice(0, 50).every((p) => p === 0), 'silent half should be flat');
  check(peaks.slice(50).every((p) => p === 1), 'loud half should fill the height');
  check(String(fitWaveform([0.25, 0.5])) === '0.5,1', 'short input keeps every value');
  check(String(fitWaveform([0, 0, 0.5, 0.25], 2)) === '0,1', "long input keeps each group's loudest");

  // Runs recordings through the shared quality check, to catch mistakes in handing audio over. The check's own
  // judgement is tested against real music in quality/.
  let seed = 1;
  const random = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const wav = (mono) => {
    const stereo = new Float32Array(mono.length * 2);
    mono.forEach((value, i) => { stereo[i * 2] = value; stereo[i * 2 + 1] = value; });
    return new File([new ArrayBuffer(HEADER_SIZE), stereo], 'quality.wav');
  };
  // A minute of 16-bit noise, the same in both channels, is long enough to be read in parts.
  const noise = new Float32Array(SAMPLE_RATE * 60).map(() => Math.round((random() - 0.5) * 16384) / 32768);
  const clean = await checkQuality('noise.wav', wav(noise));
  check(clean.verdict === 'lossless' && clean.label === 'Lossless', `noise should be lossless, got ${clean.summary}`);
  check(clean.summary.includes('16-bit'), `samples should reach the check unchanged, got ${clean.summary}`);
  check(clean.summary.includes('really mono'), `channels should reach the check in order, got ${clean.summary}`);
  // A thousand tones below 16 kHz and nothing above, the way a 128 kbps MP3 cuts off.
  const tones = new Float32Array(SAMPLE_RATE * 5);
  for (let tone = 0; tone < 1000; tone++) {
    const step = (2 * Math.PI * (100 + random() * 15900)) / SAMPLE_RATE;
    const phase = random() * 2 * Math.PI;
    const [turnRe, turnIm] = [Math.cos(step), Math.sin(step)];
    let [re, im] = [Math.cos(phase), Math.sin(phase)];
    for (let i = 0; i < tones.length; i++) {
      tones[i] += 0.002 * re;
      [re, im] = [re * turnRe - im * turnIm, re * turnIm + im * turnRe];
    }
  }
  const lossy = await checkQuality('tones.wav', wav(tones));
  check(lossy.verdict === 'lossy' && lossy.label === '96-160 kbps', `a 16 kHz cutoff should look lossy, got ${lossy.summary}`);

  const history = new LoudnessHistory();
  for (let i = 0; i < 5000; i++) history.append(i === 1234 ? 1 : 0.1);
  check(history.values.length <= 800, "a long recording's history should stay small");
  check(Math.max(...history.values) === 1, 'merging should keep the loudest moment');

  for await (const name of folder.keys()) {
    if (name.startsWith(prefix)) await folder.removeEntry(name);
  }
}

if (new URLSearchParams(location.search).has('selfcheck')) {
  // web/check.sh reads the result from the address requested here.
  runSelfCheck()
    .then(() => fetch('/selfcheck-passed'))
    .catch((error) => fetch(`/selfcheck-failed/${encodeURIComponent(error.message)}`));
} else {
  runApp();
}
</script>
</body>
</html>
