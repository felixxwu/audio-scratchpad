name: Deploy web

on:
  push:
    branches: [main]
    paths:
      - web/**
      - firebase.json

jobs:
  deploy:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: web/check.sh
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FELIXWUDOTME }}
          projectId: felixwudotme
          channelId: live
